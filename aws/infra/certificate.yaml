AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  SLC Video Merger (AWS) - free public TLS certificate for the custom domain.
  Must be deployed in us-east-1 (CloudFront only uses certificates from there).
  DNS validation records are created automatically in the Route 53 hosted zone.

Parameters:
  DomainName:
    Type: String
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

Outputs:
  CertificateArn:
    Value: !Ref Certificate
