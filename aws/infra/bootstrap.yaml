AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  SLC Video Merger (AWS) - bootstrap resources that must exist before the main
  stack: the worker container registry and a bucket for packaged Lambda code.

Parameters:
  ProjectName:
    Type: String
    Default: slc-video-aws

Resources:
  WorkerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${ProjectName}-worker
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: false
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the 3 most recent images (storage is billed per GB)",
                "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 3 },
                "action": { "type": "expire" }
              }
            ]
          }

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${ProjectName}-artifacts-${AWS::AccountId}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-packages
            Status: Enabled
            ExpirationInDays: 30
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

Outputs:
  WorkerRepositoryUri:
    Value: !GetAtt WorkerRepository.RepositoryUri
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
